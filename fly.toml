app = "utsav-india"
primary_region = "bom" # Mumbai, India for lowest latency to Indian merchants!

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[env]
  PORT = "3000"
  NODE_ENV = "production"

[[mounts]]
  source = "utsav_data"
  destination = "/data"
  initial_size = "1gb"
